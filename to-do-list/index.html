<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #2c2a26;
      --muted: #7a7468;
      --accent: #3d6b4f;
      --accent-hover: #2f5640;
      --line: #e6e0d4;
      --done: #9a9488;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 20px;
      box-shadow: 0 12px 40px rgba(44, 42, 38, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      font-weight: 650;
    }

    p.sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      background: #fff;
      color: var(--ink);
    }

    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button.add {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.add:hover {
      background: var(--accent-hover);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
    }

    li:last-child {
      border-bottom: 0;
    }

    li label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    li.done span {
      text-decoration: line-through;
      color: var(--done);
    }

    button.delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 6px;
    }

    button.delete:hover {
      color: #8b3a3a;
    }

    .empty {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 8px 4px 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <p class="sub">Add a task, check it off, or remove it.</p>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button class="add" type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
    <p id="empty" class="empty">No tasks yet.</p>
  </main>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const empty = document.getElementById("empty");
    const STORAGE_KEY = "simple-todo-list";

    let todos = [];

    try {
      todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      todos = [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      empty.hidden = todos.length > 0;

      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        label.append(checkbox, text);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "Remove";
        del.addEventListener("click", () => {
          todos = todos.filter((item) => item.id !== todo.id);
          save();
          render();
        });

        li.append(label, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      todos.push({
        id: Date.now().toString(),
        text,
        done: false
      });
      input.value = "";
      save();
      render();
    });

    render();
  </script>
</body>
</html>
